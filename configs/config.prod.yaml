# Production environment configuration
app:
  name: "Todo API"
  version: "1.0.0"
  environment: "production"
  port: 8080
  host: "0.0.0.0"

database:
  driver: "postgres"
  host: "postgres"
  port: 5432
  name: "todo_db_prod"
  user: "postgres"
  password: "postgres"
  url: "postgres://postgres:postgres@postgres:5432/todo_db_prod?sslmode=disable"
  ssl_mode: "disable"
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: "15m"

logging:
  level: "warn"
  format: "json"
  output: "stdout"

server:
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  graceful_shutdown_timeout: "20s"

cors:
  allowed_origins: ["*"]
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowed_headers: ["*"]
  allow_credentials: true 