# Staging environment configuration
app:
  name: "Todo API"
  version: "1.0.0"
  environment: "staging"
  port: 8080
  host: "0.0.0.0"

database:
  driver: "postgres"
  host: "postgres"
  port: 5432
  name: "todo_db_staging"
  user: "postgres"
  password: "postgres"
  url: "postgres://postgres:postgres@postgres:5432/todo_db_staging?sslmode=disable"
  ssl_mode: "disable"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: "10m"

logging:
  level: "info"
  format: "json"
  output: "stdout"

server:
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  graceful_shutdown_timeout: "15s"

cors:
  allowed_origins: ["*"]
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowed_headers: ["*"]
  allow_credentials: true 