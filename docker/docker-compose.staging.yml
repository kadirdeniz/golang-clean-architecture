version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: todo_postgres_staging
    environment:
      POSTGRES_DB: todo_db_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - todo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_db_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migration Service
  migrate:
    image: migrate/migrate:latest
    container_name: todo_migrate_staging
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/todo_db_staging?sslmode=disable
    volumes:
      - ../migrations:/migrations
    networks:
      - todo_network
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres@postgres:5432/todo_db_staging?sslmode=disable", "up"]
    restart: "no"

  # Application Server
  app:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: todo_app_staging
    environment:
      CONFIG_FILE_NAME: config.staging
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - todo_network
    volumes:
      - ../configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Test Runner (using Go image directly)
  test:
    image: golang:1.23-alpine
    container_name: todo_test_staging
    environment:
      CONFIG_FILE_NAME: config.staging
      CGO_ENABLED: 0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - todo_network
    volumes:
      - ../:/app
      - ../configs:/app/configs:ro
    working_dir: /app
    command: ["sh", "-c", "apk add --no-cache git && go mod download && go test ./... -v -cover"]

  # Admin Panel (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: todo_pgadmin_staging
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@todo.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - todo_network
    volumes:
      - pgadmin_data_staging:/var/lib/pgadmin

volumes:
  postgres_data_staging:
  pgadmin_data_staging:

networks:
  todo_network:
    driver: bridge 