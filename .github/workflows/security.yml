name: Security Scanning

on:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GO_VERSION: '1.23'

jobs:
  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run Go vulnerability check
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Run Nancy (Sonatype dependency scanner)
      run: |
        go list -json -m all | curl -s -X POST -H "Content-Type: application/json" \
          -d @- "https://ossindex.sonatype.org/api/v3/component-report" | \
          jq '.[] | select(.vulnerabilities | length > 0)'

    - name: Check for known security issues in dependencies
      run: |
        echo "Checking for known security vulnerabilities in Go dependencies..."
        go mod download
        go list -m all | grep -E "(jwt|crypto|sql|net|http)" || true

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install Wire
      run: go install github.com/google/wire/cmd/wire@latest

    - name: Generate Wire code
      run: |
        cd cmd/server
        wire
        cd ../..

    - name: Install gosec
      run: go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest

    - name: Run gosec (Go Security Checker)
      run: |
        gosec -fmt sarif -out gosec-results.sarif ./...

    - name: Upload SARIF file to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: gosec-results.sarif

    - name: Run golangci-lint with security checks
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --enable gosec,gas,ineffassign,misspell --timeout=10m

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for potential hardcoded secrets..."
        # Check for common secret patterns
        grep -r -i --exclude-dir=.git --exclude-dir=vendor \
          -E "(password|secret|key|token|api_key|access_key)" . || true
        
        # Check for potential AWS keys
        grep -r -E "AKIA[0-9A-Z]{16}" . || true
        
        # Check for potential database URLs
        grep -r -E "postgres://|mysql://|mongodb://" . || true

  docker-security:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install Wire
      run: go install github.com/google/wire/cmd/wire@latest

    - name: Generate Wire code
      run: |
        cd cmd/server
        wire
        cd ../..

    - name: Build Docker image
      run: |
        docker build -t golang-clean-architecture:security-scan .

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy

    - name: Run Trivy vulnerability scanner
      run: |
        trivy image --exit-code 0 --severity LOW,MEDIUM --format table golang-clean-architecture:security-scan
        trivy image --exit-code 1 --severity HIGH,CRITICAL --format sarif --output trivy-results.sarif golang-clean-architecture:security-scan

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif

    - name: Check Docker image for security best practices
      run: |
        echo "Checking Docker image security best practices..."
        
        # Check if image runs as non-root user
        USER_ID=$(docker run --rm golang-clean-architecture:security-scan id -u)
        if [ "$USER_ID" != "0" ]; then
          echo "✅ Image runs as non-root user (UID: $USER_ID)"
        else
          echo "⚠️ Image runs as root user - consider using non-root user"
        fi
        
        # Check image size
        IMAGE_SIZE=$(docker image inspect golang-clean-architecture:security-scan --format='{{.Size}}')
        echo "📦 Image size: $(echo $IMAGE_SIZE | numfmt --to=iec)"
        
        # Check for Alpine/distroless base
        if docker history golang-clean-architecture:security-scan | grep -q alpine; then
          echo "✅ Uses Alpine base image"
        elif docker history golang-clean-architecture:security-scan | grep -q distroless; then
          echo "✅ Uses distroless base image"
        else
          echo "⚠️ Consider using Alpine or distroless base image for better security"
        fi

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install go-licenses
      run: go install github.com/google/go-licenses@latest

    - name: Check licenses
      run: |
        echo "Checking licenses of dependencies..."
        go-licenses report ./... || true
        
        echo "Checking for restricted licenses..."
        # Check for GPL licenses which might require special consideration
        go-licenses csv ./... | grep -i gpl || true

  configuration-security:
    name: Configuration Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check configuration security
      run: |
        echo "Checking configuration files for security issues..."
        
        # Check for default passwords
        grep -r -i "password.*=.*postgres\|password.*=.*admin\|password.*=.*123" configs/ || echo "No default passwords found"
        
        # Check for debug mode in production configs
        if grep -q "debug.*true\|level.*debug" configs/config.prod.yaml; then
          echo "⚠️ Debug mode enabled in production config"
        else
          echo "✅ Debug mode not enabled in production config"
        fi
        
        # Check for SSL/TLS configuration
        if grep -q "ssl_mode.*disable" configs/config.prod.yaml; then
          echo "⚠️ SSL disabled in production database config"
        else
          echo "✅ SSL configuration looks secure"
        fi
        
        # Check for CORS configuration
        if grep -q "allowed_origins.*\*" configs/config.prod.yaml; then
          echo "⚠️ CORS allows all origins in production"
        else
          echo "✅ CORS configuration is restrictive"
        fi

  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

    - name: Run GitLeaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-check, static-analysis, docker-security, license-check, configuration-security, secrets-detection]
    if: always()
    
    steps:
    - name: Security Scan Summary
      run: |
        echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "### Completed Scans" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Dependency vulnerability scan" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Static code analysis" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Docker image security scan" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ License compliance check" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Configuration security check" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Secrets detection" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Review any security findings in the Security tab" >> $GITHUB_STEP_SUMMARY
        echo "2. Update dependencies with known vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo "3. Fix any identified security issues" >> $GITHUB_STEP_SUMMARY
        echo "4. Consider implementing additional security measures" >> $GITHUB_STEP_SUMMARY

    - name: Check if any security job failed
      run: |
        if [ "${{ needs.dependency-check.result }}" != "success" ] || 
           [ "${{ needs.static-analysis.result }}" != "success" ] || 
           [ "${{ needs.docker-security.result }}" != "success" ] || 
           [ "${{ needs.license-check.result }}" != "success" ] || 
           [ "${{ needs.configuration-security.result }}" != "success" ] || 
           [ "${{ needs.secrets-detection.result }}" != "success" ]; then
          echo "⚠️ One or more security scans failed. Please review the results."
          exit 1
        else
          echo "✅ All security scans passed successfully!"
        fi 